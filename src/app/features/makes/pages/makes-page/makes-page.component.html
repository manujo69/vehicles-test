@if (loading()) {
  <app-loading-spinner />
} @else {
  <div class="page-title">{{ messages.pageTitle }}</div>
  <div class="search-row">
    <app-search-box [initialValue]="filter()" (searched)="onSearch($event)" />
    <button mat-mini-fab type="button" color="primary" (click)="makesList()?.scrollUp()">
      <mat-icon>keyboard_arrow_up</mat-icon>
    </button>
    <button mat-mini-fab type="button" color="primary" (click)="makesList()?.scrollDown()">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>
  <app-makes-list [makes]="makes()" (selected)="onSelect($event)" />
}
