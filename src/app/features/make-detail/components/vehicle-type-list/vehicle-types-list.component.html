  <mat-list>
    @for (type of types(); track type.id) {
      <mat-list-item [ngClass]="{ 'selected': type.id === selectType() }" class="typeItem" (click)="onSelectType(type.id)">{{ type.name }}</mat-list-item>
    } @empty {
      <p class="empty">{{ messages.emptyTypes }}</p>
    }
  </mat-list>
