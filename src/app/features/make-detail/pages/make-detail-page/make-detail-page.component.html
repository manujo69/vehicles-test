@if (loading()) {
  <app-loading-spinner />
} @else {
  <app-breadcrumb [items]="breadcrumbs()" />
  <section class="block">
    <h2>{{ messages.vehicleTypesTitle }}</h2>
    <app-vehicle-types-list [types]="typesQuery.data() ?? []" />
  </section>
  <section class="block block--models">
    <h2>{{ messages.modelsTitle }}</h2>
    <app-models-list [models]="modelsQuery.data() ?? []" />
  </section>
}
