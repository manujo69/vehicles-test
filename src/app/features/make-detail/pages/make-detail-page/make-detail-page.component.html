
@if (loading()) {
  <app-loading-spinner />
} @else if (detail(); as d) {
  <app-breadcrumb [items]="breadcrumbs()" />
  <section class="block">
    <h2>{{ messages.vehicleTypesTitle }}</h2>
    <app-vehicle-types-list [types]="d.types" (selectTypeOutput)="onSelectType($event)" />
  </section>
  <section class="block block--models">
    <h2>{{ messages.modelsTitle }}</h2>
    <app-models-list [models]="displayedModels()" />
  </section>
}
